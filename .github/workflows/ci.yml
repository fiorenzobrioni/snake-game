name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  # Manual run from the Actions tab: pick any branch to build its APK
  # (downloadable as the app-debug-apk artifact) without opening a PR.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # A single Gradle invocation shares the task graph: assembleDebug
      # compiles the app (the real "does it build?" check), the unit tests
      # exercise the game/ model, and lintDebug runs Android lint.
      - name: Assemble debug APK, run unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      # Minified and shrunk, so it is the only build where R8 problems can show
      # up at all. Signed with the committed debug key purely so it is
      # installable for smoke tests - NOT a release artifact (published
      # releases are built by release.yml with the real key).
      - name: Assemble release APK (debug-signed, for testing only)
        run: ./gradlew :app:assembleRelease -PsignReleaseWithDebugKey

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK (testing only)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk-testing-only
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # The R8 map makes a release-build stack trace readable; without the run
      # that produced the APK it is gone.
      - name: Upload R8 Mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      - name: Upload Test & Lint Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7
